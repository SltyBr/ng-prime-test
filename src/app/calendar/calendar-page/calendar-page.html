@let selectedYear = store.selectedYear();

<p-toolbar class="toolbar">
  <ng-template #start>
    <button
      pButton
      type="button"
      severity="secondary"
      text
      size="small"
      [disabled]="!selectedYear || entries().isLoading || entries().isError?.reason === 'loaded'"
      (click)="openCreateDialog()"
    >
      <img src="icons/plus.svg" alt="" />
      Добавить
    </button>
    <button
      pButton
      type="button"
      severity="danger"
      text
      size="small"
      [disabled]="!selectedEntry() || entries().isLoading"
      (click)="removeSelected()"
    >
      <img src="icons/delete.svg" alt="" />
      Удалить
    </button>
  </ng-template>

  <ng-template #end>
    <label class="year-select" for="year">
      Год:
      <p-select
        inputId="year"
        [options]="years().data"
        [ngModel]="selectedYear"
        (ngModelChange)="changeYear($event)"
        [loading]="years().isLoading"
        [disabled]="!years().data.length || entries().isLoading"
        size="small"
      />
    </label>
  </ng-template>
</p-toolbar>

@if (years().isError) {
  <p class="error">
    {{ texts.yearsLoadError }}
    <button pButton type="button" severity="danger" text size="small" (click)="reloadYears()">
      {{ texts.reload }}
    </button>
  </p>
}
@if (entries().isError?.reason === 'loaded' && selectedYear) {
  <p class="error">
    {{ texts.entriesLoadError(selectedYear) }}
    <button pButton type="button" severity="danger" text size="small" (click)="reloadYear()">
      {{ texts.reload }}
    </button>
  </p>
}

<main class="content">
  <app-entries-table
    class="content__table"
    [entries]="entries().data"
    [loading]="years().isLoading || entries().isLoading"
    [selected]="selectedEntry()"
    (selectedChange)="setSelectedEntry($event)"
    (rowDblClick)="openEditDialog($event)"
  />

  <div class="content__calendar">
    <div class="content__calendar-scroll">
      @if (selectedYear) {
        <app-year-calendar
          [year]="selectedYear"
          [entries]="entries().data"
          [selectedDate]="selectedDate()"
          (dateSelect)="selectDate($event)"
          (dateDblClick)="openDialogForDate($event)"
        />
      }
    </div>

    @if (entries().isLoading) {
      <div class="content__loader">
        <p-progress-spinner strokeWidth="4" ariaLabel="Загрузка календаря" />
      </div>
    }
  </div>
</main>

<p-confirmdialog />
<p-toast />
