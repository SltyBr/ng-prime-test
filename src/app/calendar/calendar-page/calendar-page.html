<p-toolbar class="toolbar">
  <ng-template #start>
    <button
      pButton
      type="button"
      severity="secondary"
      text
      size="small"
      [disabled]="store.yearState().status !== 'loaded'"
      (click)="openCreateDialog()"
    >
      <img src="icons/plus.svg" alt="" />
      Добавить
    </button>
    <button
      pButton
      type="button"
      severity="danger"
      text
      size="small"
      [disabled]="!store.selectedEntry()"
      (click)="removeSelected()"
    >
      <img src="icons/delete.svg" alt="" />
      Удалить
    </button>
  </ng-template>

  <ng-template #end>
    <label class="year-select" for="year">
      Год:
      <p-select
        inputId="year"
        [options]="store.years()"
        [ngModel]="store.year()"
        (ngModelChange)="selectYear($event)"
        [loading]="store.yearsState().status === 'loading'"
        [disabled]="!store.years().length"
        size="small"
      />
    </label>
  </ng-template>
</p-toolbar>

@if (store.yearsState().status === 'error') {
  <p class="error">{{ texts.yearsLoadError }}</p>
}
@if (store.yearState().status === 'error') {
  <p class="error">{{ texts.entriesLoadError(store.year()!) }}</p>
}

<main class="content">
  <app-entries-table
    class="content__table"
    [entries]="store.entries()"
    [loading]="store.yearState().status === 'loading'"
    [selected]="store.selectedEntry()"
    (selectedChange)="store.selectDate($event?.date ?? null)"
    (rowDblClick)="openEditDialog($event)"
  />

  <div class="content__calendar">
    <div #calendarScroll class="content__calendar-scroll">
      @if (store.year(); as year) {
        <app-year-calendar
          [year]="year"
          [entries]="store.entries()"
          [selectedDate]="store.selectedDate()"
          (dateSelect)="store.selectDate($event)"
          (dateDblClick)="openDialogForDate($event)"
        />
      }
    </div>

    @if (store.yearState().status === 'loading') {
      <div class="content__loader">
        <p-progress-spinner strokeWidth="4" ariaLabel="Загрузка календаря" />
      </div>
    }
  </div>
</main>

<p-confirmdialog />
<p-toast />
