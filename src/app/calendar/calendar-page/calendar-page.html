<p-toolbar class="toolbar">
  <ng-template #start>
    <button pButton type="button" severity="secondary" text size="small" (click)="openEntryDialog()">
      <img src="icons/plus.svg" alt="" />
      Добавить
    </button>
    <button
      pButton
      type="button"
      severity="danger"
      text
      size="small"
      [disabled]="!store.selectedEntry()"
      (click)="removeSelected()"
    >
      <img src="icons/delete.svg" alt="" />
      Удалить
    </button>
  </ng-template>

  <ng-template #end>
    <label class="year-select" for="year">
      Год:
      <p-select
        inputId="year"
        [options]="store.years()"
        [ngModel]="store.year()"
        (ngModelChange)="store.selectYear($event)"
        size="small"
      />
    </label>
  </ng-template>
</p-toolbar>

@if (store.error(); as error) {
  <p class="error">{{ error }}</p>
}

<main class="content">
  <app-entries-table
    class="content__table"
    [entries]="store.entries()"
    [loading]="store.isLoading()"
    [selected]="store.selectedEntry()"
    (selectedChange)="store.selectDate($event?.date ?? null)"
    (rowDblClick)="openEntryDialog($event)"
  />

  <div #calendarScroll class="content__calendar">
    @if (store.year(); as year) {
      <app-year-calendar
        [year]="year"
        [entries]="store.entries()"
        [selectedDate]="store.selectedDate()"
        (dateSelect)="store.selectDate($event)"
      />
    }
  </div>
</main>

<p-confirmdialog />
