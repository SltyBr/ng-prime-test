@for (month of months(); track $index) {
  <section #monthElement class="month">
    <header class="month__header">
      <h3 class="month__title">{{ month.name }}</h3>
      @if (month.isCurrent) {
        <span class="month__today">{{ todayLabel }}</span>
      }
    </header>

    <p-datepicker
      inline
      showOtherMonths
      [selectOtherMonths]="false"
      [defaultDate]="month.firstDay"
      [minDate]="month.firstDay"
      [maxDate]="month.lastDay"
      [ngModel]="selectedMonth() === $index ? selectedDay() : null"
      (ngModelChange)="onSelect($event)"
    >
      <ng-template #date let-meta let-selected="selected">
        <span
          [class]="meta | dayClasses: typeByDate() : selected"
          (dblclick)="onDateDblClick(meta)"
        >
          {{ meta.day }}
        </span>
      </ng-template>
    </p-datepicker>
  </section>
}
