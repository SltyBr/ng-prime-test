<p-iftalabel>
  <p-datepicker
    inputId="entry-date"
    [ngModel]="date()"
    (ngModelChange)="date.set($event)"
    [disabled]="isEdit()"
    [minDate]="minDate()"
    [maxDate]="maxDate()"
    showIcon
    iconDisplay="input"
    appendTo="body"
    fluid
  />
  <label for="entry-date">Дата <span class="required">*</span></label>
</p-iftalabel>

<p-iftalabel>
  <p-select
    inputId="entry-type"
    [options]="typeOptions"
    optionLabel="label"
    optionValue="value"
    [ngModel]="type()"
    (ngModelChange)="type.set($event)"
    appendTo="body"
    fluid
  />
  <label for="entry-type">Тип <span class="required">*</span></label>
</p-iftalabel>

<div class="actions">
  <button pButton type="button" [disabled]="!isValid() || !isChanged()" (click)="submit()">
    {{ isEdit() ? 'Сохранить' : 'Создать' }}
  </button>
  <button pButton type="button" severity="secondary" text (click)="cancel()">Отменить</button>
</div>

<p-confirmdialog />
